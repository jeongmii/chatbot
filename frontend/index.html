<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Toss-like Chat</title>
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="brand">ChatGPT · Toss-like</div>
    <div class="session-pill" id="sessionPill" title="Session ID"></div>
  </header>

  <main class="chat-root">
    <div id="messages" class="messages" aria-live="polite"></div>
  </main>

  <footer class="composer">
    <form id="composerForm">
      <textarea id="composerInput" rows="1" placeholder="메시지를 입력하세요" maxlength="4000" autocomplete="off"></textarea>
      <button id="sendBtn" type="submit" aria-label="Send">전송</button>
    </form>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
